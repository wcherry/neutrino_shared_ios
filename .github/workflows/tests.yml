# NeutrinoShared builds for iOS (seven apps) and macOS (the Drive client), and a change here reaches
# all of them the next time they build — there is no version pin to absorb a break. So the package's
# own tests run on both platforms for every push and pull request.
#
# On macOS only NeutrinoCore, NeutrinoAuth, NeutrinoCrypto and NeutrinoOOXML build; NeutrinoUI and
# NeutrinoPrint are iOS-only and compile to nothing there (see Package.swift), so the iOS job is the
# one that covers them.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme NeutrinoShared-Package \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath .build/xcode-ios
